name: API-test (midlertidig)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test DMI ensemble hos Open-Meteo
        run: |
          echo "=== ensemble dmi_seamless ==="
          curl -sS "https://ensemble-api.open-meteo.com/v1/ensemble?latitude=55.68&longitude=12.57&hourly=precipitation&models=dmi_seamless&forecast_days=1" | head -c 900
          echo
          echo "=== ensemble metno_seamless ==="
          curl -sS "https://ensemble-api.open-meteo.com/v1/ensemble?latitude=55.68&longitude=12.57&hourly=precipitation&models=metno_seamless&forecast_days=1" | head -c 400
          echo
      - name: Test YR/MET Norge direkte (probability + CORS)
        run: |
          echo "=== met.no headers (CORS) ==="
          curl -sSI -H "Origin: https://lau-wq.github.io" -A "VejretApp/1.0 github.com/lau-wq/Vejret" "https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=55.68&lon=12.57" | grep -i -E 'HTTP|access-control'
          echo "=== met.no probability_of_precipitation ==="
          curl -sS -A "VejretApp/1.0 github.com/lau-wq/Vejret" "https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=55.68&lon=12.57" | grep -o 'probability_of_precipitation[^,}]*' | head -5
