name: API-test (midlertidig)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: RainViewer manifest
        run: |
          curl -sS "https://api.rainviewer.com/public/weather-maps.json" | head -c 1500
          echo
      - name: RainViewer tile + CARTO tile (statuskoder)
        run: |
          path=$(curl -sS "https://api.rainviewer.com/public/weather-maps.json" | grep -oE '"path":"[^"]+"' | head -1 | cut -d'"' -f4)
          echo "path=$path"
          curl -sS -o /dev/null -w 'rainviewer tile: %{http_code} %{content_type} %{size_download}\n' "https://tilecache.rainviewer.com$path/256/6/33/19/2/1_1.png"
          curl -sS -o /dev/null -w 'carto tile: %{http_code} %{content_type} %{size_download}\n' "https://a.basemaps.cartocdn.com/dark_all/6/33/19.png"
          curl -sSI "https://tilecache.rainviewer.com$path/256/6/33/19/2/1_1.png" | grep -i 'access-control' || echo "ingen CORS-header (ok for <img>)"
