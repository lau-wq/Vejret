name: API-test (midlertidig)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: BigDataCloud reverse geocode (felter + CORS)
        run: |
          curl -sS "https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=55.6759&longitude=12.5655&localityLanguage=da" | head -c 800
          echo
          curl -sSI -H "Origin: https://lau-wq.github.io" "https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=55.6759&longitude=12.5655&localityLanguage=da" | grep -i -E 'HTTP|access-control'
